name: Verification
on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///ci.db
      CODEGUARD_TEST_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-scanner.txt
      - run: pip install -r requirements.txt
      - run: pip check
      - run: pip install pip-audit && pip-audit -r requirements.txt
      - run: |
          python -m venv .scanner
          .scanner/bin/pip install -r requirements-scanner.txt
          echo "$PWD/.scanner/bin" >> "$GITHUB_PATH"
      - run: alembic upgrade head && alembic check
      - run: docker build -f Dockerfile.runner -t codeguard-python-runner:local .
      - run: python -m unittest discover -s tests -v
      - run: PYTHONPATH=. python evaluation/run.py --gate
      - run: |
          PYTHONPATH=. python evaluation/generate_demo.py > "$RUNNER_TEMP/sample-review.json"
          diff -u ../frontend/app/demo/sample-review.json "$RUNNER_TEMP/sample-review.json"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
        env:
          CODEGUARD_STATIC_EXPORT: "1"
          NEXT_PUBLIC_API_URL: ""
